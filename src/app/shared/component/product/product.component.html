
<div class="container">
    <div class="row">
        <div class="col-md-4">
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let pro of productArr" [routerLink]="[pro.id]">
                    {{pro.name}} {{pro.id}}
                </li>
            </ul>
        </div>
        <div class="col-md-8">
            <router-outlet></router-outlet>
        </div>
        <button
        *ngIf="canAdd()"
        routerLink="/product/add"
         class="btn btn-primary mt-2 offset-md-1">Create Prod</button>
    </div>
</div>
